<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9f7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HRV Breathing">
<title>HRV Breathing · Find your calm</title>
<style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--ink:#203d3a;--sub:#657f79;--surface:#f4faf8;--line:#d6e8e2;--track:#a9c5bd;--fill:#087e70}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:linear-gradient(160deg,#f9fdfb,#e9f7f2 70%,#f5fbfa);color:var(--ink)}
.app{max-width:460px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 17px calc(20px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{font-size:10px;font-weight:750;letter-spacing:2.3px;color:#0b9e85}h1{font-size:25px;letter-spacing:-1px;margin:5px 0 2px}.sub{font-size:12px;color:var(--sub)}.status{white-space:nowrap;font-size:11px;border:1px solid var(--line);background:var(--surface);padding:7px 11px;border-radius:50px;color:var(--sub)}.status.on{color:#0c9b80}
.scene{height:285px;display:flex;align-items:center;justify-content:center;position:relative;isolation:isolate}.halo{position:absolute;width:260px;height:260px;border:1px solid #27b59426;border-radius:50%}.halo.two{width:292px;height:292px;border-style:dashed;opacity:.5}.aura{position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#54dcb860,transparent 70%);filter:blur(16px);transform:scale(.7);will-change:transform}.orb{position:relative;width:218px;height:218px;border-radius:50%;background:radial-gradient(circle at 32% 24%,#a3f6d9 0%,#5be0be 28%,#20b69a 66%,#0a8779 100%);box-shadow:inset -15px -20px 30px #00695730,inset 10px 14px 28px #ffffff50,0 16px 35px #0c987b20;display:flex;align-items:center;justify-content:center;flex-direction:column;transform:scale(.68);will-change:transform}.orb:after{content:"";position:absolute;inset:10px;border:1px solid #ffffff50;border-radius:50%;pointer-events:none}.phase{font-size:30px;font-weight:650;color:#064d43;letter-spacing:-.9px}.seconds{font-size:53px;line-height:1.13;font-weight:750;color:#064d43;font-variant-numeric:tabular-nums}.small{font-size:11px;color:#17685a}.guidance{text-align:center;margin:-5px 0 18px;font-size:13px;color:var(--sub);min-height:19px}
.durations{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}.tile,.panel{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:13px 14px}.tilehead{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub)}.dot{width:8px;height:8px;border-radius:50%;background:#46cbb1}.dot.out{background:#80b9af}.value{font-size:23px;font-weight:730;margin-top:5px;font-variant-numeric:tabular-nums}.value .sub{font-weight:400}.panel{padding:15px;margin-bottom:12px}.label{font-size:13px;font-weight:650}.panel-head{display:flex;align-items:center;justify-content:space-between}.bpm{font-size:29px;font-weight:750;color:#079b82}.slider-wrap{margin:16px 2px 9px}input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y;--pct:75%}input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:20px;background:linear-gradient(to right,var(--fill) 0%,var(--fill) var(--pct),var(--track) var(--pct),var(--track) 100%);border:1px solid #759f95}input[type=range]::-moz-range-track{height:12px;border-radius:20px;background:linear-gradient(to right,var(--fill) 0%,var(--fill) var(--pct),var(--track) var(--pct),var(--track) 100%);border:1px solid #759f95}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:50%;background:white;border:5px solid #087e70;box-shadow:0 2px 8px #07584b55;margin-top:-9px}input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:white;border:5px solid #087e70;box-shadow:0 2px 8px #07584b55}input:focus-visible,button:focus-visible{outline:3px solid #2ba68d;outline-offset:3px}.ticks,.ends{display:flex;justify-content:space-between;color:var(--sub);font-size:10px;margin:0 12px}.ends{font-size:11px;margin:7px 0 0}.patterns{display:flex;gap:7px;margin-top:12px}.pattern{flex:1;min-width:0;padding:11px 5px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:12px;font-weight:650;cursor:pointer}.pattern.active{background:#087f70;color:white;border-color:#087f70}.pattern span{display:block;font-size:10px;font-weight:400;opacity:.8;margin-top:3px}.actions{display:flex;gap:10px;margin-top:16px}.actions button{border-radius:15px;padding:15px 8px;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}.start{flex:1.5;border:0;background:linear-gradient(115deg,#16b497,#078b79);color:white;box-shadow:0 7px 18px #0b9d812e}.stop{flex:1;background:var(--surface);color:var(--ink);border:1px solid var(--line)}.footer{text-align:center;font-size:11px;color:var(--sub);margin-top:14px}.pending{font-size:11px;color:#0c9b80;margin-top:5px;min-height:0}
@media(prefers-color-scheme:dark){:root{--ink:#e5f8f1;--sub:#a4c1b9;--surface:#193c37;--line:#315650;--track:#54736c}body{background:linear-gradient(160deg,#102c29,#163b34 75%,#102b29)}.eyebrow{color:#76e4c8}.bpm{color:#65e2c3}}
@media(max-height:730px){.scene{height:240px}.halo{width:225px;height:225px}.halo.two{width:252px;height:252px}.orb{width:200px;height:200px}.aura{width:200px;height:200px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><div class="eyebrow">MINDFUL RHYTHM</div><h1>Find your calm.</h1><div class="sub">A moment to reset, one breath at a time.</div></div><div id="status" class="status">● Ready</div></header>
<div class="scene" aria-label="Animated breathing circle"><div class="halo two"></div><div class="halo"></div><div id="aura" class="aura"></div><div id="orb" class="orb"><div id="phase" class="phase">Breathe</div><div id="count" class="seconds">4</div><div class="small">seconds</div></div></div>
<div id="guidance" class="guidance" aria-live="off">Follow the gentle rhythm of the circle</div>
<section class="durations" aria-label="Breathing durations"><div class="tile"><div class="tilehead"><span class="dot"></span> Inhale</div><div class="value"><span id="inhale-duration">4.0</span> <span class="sub">sec</span></div></div><div class="tile"><div class="tilehead"><span class="dot out"></span> Exhale</div><div class="value"><span id="exhale-duration">6.0</span> <span class="sub">sec</span></div></div></section>
<section class="panel"><div class="panel-head"><label class="label" for="slider">Breaths Per Minute</label><div><span id="bpm" class="bpm">6.0</span> <span class="sub">BPM</span></div></div><div class="slider-wrap"><input id="slider" type="range" min="4.5" max="6.5" step="0.5" value="6" aria-label="Breaths per minute"></div><div class="ticks"><span>4.5</span><span>5.0</span><span>5.5</span><span>6.0</span><span>6.5</span></div><div class="ends"><span>Slower</span><span>Faster</span></div><div id="pending" class="pending" aria-live="polite"></div></section>
<section class="panel"><div class="label">Breathing pattern</div><div class="patterns"><button type="button" class="pattern active" data-ratio="0.4" aria-pressed="true">Longer Exhale<span>40% in · 60% out</span></button><button type="button" class="pattern" data-ratio="0.5" aria-pressed="false">Equal Breathing<span>50% in · 50% out</span></button></div></section>
<div class="actions"><button type="button" id="start" class="start">▶ &nbsp; Begin breathing</button><button type="button" id="stop" class="stop">■ &nbsp; Stop</button></div>
<div id="footer" class="footer">Your pace. Your moment. No rush.</div>
</main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let bpm=6,ratio=.4,activeBpm=6,activeRatio=.4,running=false,started=0,frameId=0,cycles=0;
const duration=(b,r)=>({inhale:60/b*r,exhale:60/b*(1-r),total:60/b});
const whole=n=>String(Math.max(1,Math.ceil(n-0.00001)));
function refresh(){const d=duration(bpm,ratio);$('bpm').textContent=bpm.toFixed(1);$('inhale-duration').textContent=d.inhale.toFixed(1);$('exhale-duration').textContent=d.exhale.toFixed(1);$('slider').style.setProperty('--pct',((bpm-4.5)/2*100)+'%');if(!running)$('count').textContent=whole(d.inhale);$('pending').textContent=running&&(bpm!==activeBpm||ratio!==activeRatio)?'New rhythm begins on your next cycle':'';}
function reset(){running=false;cancelAnimationFrame(frameId);cycles=0;$('phase').textContent='Breathe';$('count').textContent=whole(duration(bpm,ratio).inhale);$('orb').style.transform='scale(.68)';$('aura').style.transform='scale(.7)';$('status').textContent='● Ready';$('status').classList.remove('on');$('guidance').textContent='Follow the gentle rhythm of the circle';$('footer').textContent='Your pace. Your moment. No rush.';$('pending').textContent='';}
function tick(now){if(!running)return;let d=duration(activeBpm,activeRatio);let elapsed=Math.max(0,(now-started)/1000);if(elapsed>=d.total){const completed=Math.floor(elapsed/d.total);cycles+=completed;started+=completed*d.total*1000;if(bpm!==activeBpm||ratio!==activeRatio){activeBpm=bpm;activeRatio=ratio;started=now;$('pending').textContent='';}d=duration(activeBpm,activeRatio);elapsed=Math.max(0,(now-started)/1000);}
const inhale=elapsed<d.inhale,remaining=inhale?d.inhale-elapsed:d.total-elapsed;const p=inhale?elapsed/d.inhale:(elapsed-d.inhale)/d.exhale;const ease=(1-Math.cos(Math.PI*Math.max(0,Math.min(1,p))))/2;const scale=inhale?.68+.32*ease:1-.32*ease;$('orb').style.transform=`scale(${scale})`;$('aura').style.transform=`scale(${scale*1.18})`;$('phase').textContent=inhale?'Inhale':'Exhale';$('count').textContent=whole(remaining);$('guidance').textContent=inhale?'Gently breathe in':'Slowly release your breath';$('status').textContent='● In session';$('status').classList.add('on');$('footer').textContent=`Breath ${cycles+1} · Stay with your rhythm`;frameId=requestAnimationFrame(tick);}
$('slider').addEventListener('input',e=>{bpm=Number(e.target.value);refresh()});document.querySelectorAll('.pattern').forEach(button=>button.addEventListener('click',()=>{ratio=Number(button.dataset.ratio);document.querySelectorAll('.pattern').forEach(item=>{const selected=item===button;item.classList.toggle('active',selected);item.setAttribute('aria-pressed',String(selected));});refresh()}));$('start').addEventListener('click',()=>{cancelAnimationFrame(frameId);activeBpm=bpm;activeRatio=ratio;running=true;cycles=0;started=performance.now();$('pending').textContent='';tick(started)});$('stop').addEventListener('click',reset);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running){cancelAnimationFrame(frameId);frameId=requestAnimationFrame(tick)}});refresh();reset();
})();
</script>
</body>
</html>
